# /etc/nginx/conf.d/smartboard.conf
# Smartboard — Amazon Linux 2023 nginx site
# Serves: static React SPA + reverse proxy to ASP.NET Core API on port 5000

server {
    listen 80;
    server_name _;                     # replace with smartboard.savitroday.com once DNS is set

    # ── Static frontend files ──────────────────────────────────────────────
    root  /opt/smartboard/www;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Long cache for hashed assets, no-cache for index.html
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ── API proxy to Kestrel ───────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Health / readiness (bypass auth for load-balancer checks)
    location ~ ^/(healthz|readyz)$ {
        proxy_pass http://127.0.0.1:5000;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}

